<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#070b1d" />
    <title>SPRITE-INDEX — Backoffice</title>
    <link rel="stylesheet" href="/css/admin.css" />
  </head>
  <body class="admin-access-page">
    <main class="admin-access-card" aria-labelledby="accessTitle">
      <div class="admin-brand" aria-label="SPRITE-INDEX">
        <img class="admin-brand__logo" src="/LogoBackoffice.png" alt="Sprite-Index Backoffice" />
      </div>
      <p class="admin-eyebrow" data-copy="eyebrow">ACCÈS ADMINISTRATEUR</p>
      <h1 id="accessTitle" data-copy="title">Vérification sécurisée</h1>
      <p class="admin-access-card__lead" id="accessMessage" data-copy="loading">Préparation de votre session sécurisée…</p>
      <div class="admin-access-card__loader" aria-hidden="true"><i></i><i></i><i></i></div>
      <p class="admin-access-card__note" data-copy="note">Ce lien est à usage unique et n’est jamais enregistré dans votre historique.</p>
    </main>
    <script src="/js/admin-access.js"></script>
  </body>
</html>
