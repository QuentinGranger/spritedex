    <dialog class="admin-dialog admin-dialog--bulk" id="bulkActionDialog" aria-labelledby="bulkActionTitle"><form class="admin-dialog__surface" id="bulkActionForm"><header class="admin-dialog__header"><div><p class="admin-eyebrow">ACTION DE MASSE · APERÇU</p><h2 id="bulkActionTitle">Confirmer l’action</h2><p id="bulkActionSummary"></p></div><button class="admin-dialog__close" id="bulkActionClose" type="button" aria-label="Fermer">×</button></header><div class="admin-bulk-plan" id="bulkActionPlan" aria-live="polite"></div><div class="admin-dialog__warning" id="bulkActionImpact"></div><div class="admin-bulk-preview" id="bulkActionItems" hidden></div><div class="admin-dialog__fields"><label class="admin-field admin-field--wide"><span>Justification</span><textarea id="bulkActionReason" maxlength="1000" required placeholder="Ex. vérification des sources officielles du 1er août"></textarea></label><label class="admin-bulk-ack" id="bulkActionAcknowledgeWrap" hidden><input id="bulkActionAcknowledge" type="checkbox" /><span><strong id="bulkActionAcknowledgeTitle">J’ai vérifié l’aperçu.</strong><small id="bulkActionAcknowledgeHint">L’action sera appliquée immédiatement et journalisée.</small></span></label></div><div class="admin-bulk-progress" id="bulkActionProgress" hidden role="status"><span id="bulkActionProgressLabel">Préparation…</span><i aria-hidden="true"></i></div><p class="admin-dialog__error" id="bulkActionError" hidden role="alert"></p><footer class="admin-dialog__footer"><button class="admin-button admin-button--quiet" id="bulkActionCancel" type="button">Annuler</button><button class="admin-button" id="bulkActionSubmit" type="submit">Appliquer l’action</button></footer></form></dialog>
