    <dialog id="compareSpriteDialog" class="compare-sprite-dialog">
      <form method="dialog" class="compare-sprite-detail">
        <button class="close-button" value="cancel" data-i18n-aria-label="dialog.close" aria-label="Fermer">×</button>
        <div class="compare-sprite-detail__content" id="compareSpriteDetailContent"></div>
      </form>
    </dialog>

    <dialog id="shareCompareDialog" class="share-compare-dialog">
      <form method="dialog" class="dialog-card share-compare-form">
        <button class="close-button" value="cancel" data-i18n-aria-label="dialog.close" aria-label="Fermer">×</button>
        <h3 id="shareCompareTitle" data-i18n="compare.shareTitle">Partager ma comparaison</h3>
        <p class="share-compare-intro" id="shareCompareIntro" data-i18n="compare.shareIntro">Génère un lien et un QR code à envoyer à tes amis.</p>
        <div id="shareCompareOptions">
          <label class="share-compare-field">
            <span data-i18n="compare.shareDuration">Durée</span>
            <select id="shareCompareDuration">
              <option value="1h" data-i18n="compare.duration1h">1 heure</option>
              <option value="24h" selected data-i18n="compare.duration24h">24 heures</option>
              <option value="7d" data-i18n="compare.duration7d">7 jours</option>
              <option value="none" data-i18n="compare.durationNone">Sans expiration</option>
            </select>
          </label>
          <label class="share-compare-check"><input type="checkbox" id="shareCompareCollection" checked> <span data-i18n="compare.shareCollection">Collection visible</span></label>
          <label class="share-compare-check"><input type="checkbox" id="shareCompareNotes"> <span data-i18n="compare.shareNotes">Afficher les notes</span></label>
          <label class="share-compare-check"><input type="checkbox" id="shareComparePriorities" checked> <span data-i18n="compare.sharePriorities">Afficher les priorités</span></label>
          <label class="share-compare-check"><input type="checkbox" id="shareCompareVisitor" checked> <span data-i18n="compare.shareVisitor">Permettre la comparaison avec le visiteur</span></label>
        </div>
        <button type="submit" class="login-btn" id="shareCompareGenerate" data-i18n="compare.generateLink">Générer le lien</button>
        <div id="shareCompareResult" class="share-compare-result">
          <img id="shareCompareQr" class="share-compare-qr" data-i18n-alt="compare.qrAlt" alt="QR code du lien de partage" />
          <p class="share-compare-url"><a id="shareCompareUrl" href="#" target="_blank" rel="noopener"></a></p>
          <button type="button" class="ghost-button" id="shareCompareCopy" data-i18n="compare.copyLink">Copier le lien</button>
        </div>
      </form>
    </dialog>
