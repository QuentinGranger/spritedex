    <dialog id="squadInviteDialog" class="squad-invite-dialog">
      <form method="dialog" class="dialog-card squad-invite-form">
        <button class="close-button" value="cancel" aria-label="Fermer" data-i18n-aria-label="dialog.close">×</button>
        <h3 id="squadInviteDialogTitle" data-i18n="squad.inviteDialogTitle">Inviter dans une escouade</h3>
        <div id="squadInviteDialogOptions" class="squad-invite-options"></div>
        <div class="squad-invite-actions">
          <button type="button" class="ghost-button" value="cancel" data-i18n="common.cancel">Annuler</button>
          <button type="submit" class="login-btn" id="squadInviteDialogConfirm" disabled data-i18n="squad.inviteBtn">Inviter</button>
        </div>
      </form>
    </dialog>
